# staging の初期構築（手動実行 / 1 回だけ）
#
# runbook: docs/runbook/deploy.md §3.5
#
# ── なぜワークフローにするのか ──────────────────────────
# §3.5 は「人間の端末で実行する」手順として書いてある。**Actions の runner なら
# Cloudflare へ到達でき、資格情報も GitHub Secrets から取れる。** 人が打つのは
# 「Run workflow」だけになる。
#
# ── 安全のための決め事 ──────────────────────────────────
#   * `workflow_dispatch` のみ。**push では絶対に走らない。**
#   * `confirm` に CREATE と打たないと何もしない。**課金資源を作るため。**
#   * 触るのは名前に `-staging` が付く資源だけ。**production の名前は出さない。**
#   * ID（D1 / KV）は秘密ではない。**そのまま wrangler.toml に載る値。**
#     秘密（SESSION_SECRET など）はログにも出力にも出さない。
#
# ── Queues は有料プランが要る ───────────────────────────
# 無料プランでは `wrangler queues create` が通らない。7 本は
# `[env.staging.queues.consumers]` に宣言済みなので、**キューが無いと
# `wrangler deploy` 自体が失敗する。** phase=resources が落ちたら、まず
# プランを確かめること。
name: staging-bootstrap

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "check = 読むだけ / resources = 資源を作り ID の PR を出す / reset-db = staging の D1 を空にする（復旧用） / migrate = 未適用の migration だけを流す / secrets-and-seed = migration・秘密・シード"
        required: true
        type: choice
        options:
          - check
          - db-status
          - smoke
          - mark-applied
          - migrate
          - resources
          - reset-db
          - secrets-and-seed
      confirm:
        description: "CREATE と入力すると実行する（phase=check では不要 / reset-db は RESET-STAGING-DB）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  # **この 2 つ以外の環境名をこのファイルに書かないこと。**
  WORKER_NAME: pk-staging
  CF_ENV: staging
  # KV の title は `proofkeeping-{BINDING}-staging`。**環境名は後ろに付く。**
  # （`wrangler kv namespace create SESSION --env staging` の実際の出力）
  KV_TITLE_PREFIX: proofkeeping

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      # **check は何も作らないので confirm を要求しない。**
      # 作る phase だけを CREATE で守る。
      - name: 実行確認
        run: |
          if [ "${{ inputs.phase }}" = "check" ] || [ "${{ inputs.phase }}" = "db-status" ] || [ "${{ inputs.phase }}" = "smoke" ]; then
            echo "${{ inputs.phase }}: 読み取りのみ。何も変更しません。"
            exit 0
          fi
          if [ "${{ inputs.phase }}" = "mark-applied" ]; then
            if [ "${{ inputs.confirm }}" != "MARK-APPLIED" ]; then
              echo "phase=mark-applied には confirm に MARK-APPLIED が要ります。"
              exit 1
            fi
            exit 0
          fi
          if [ "${{ inputs.phase }}" = "reset-db" ]; then
            # **表を落とす操作だけは合言葉を変える。** CREATE の惰性で
            # 押せてしまわないようにする。
            if [ "${{ inputs.confirm }}" != "RESET-STAGING-DB" ]; then
              echo "phase=reset-db には confirm に RESET-STAGING-DB が要ります。"
              exit 1
            fi
            exit 0
          fi
          if [ "${{ inputs.confirm }}" != "CREATE" ]; then
            echo "confirm に CREATE と入力されていません。何もせずに終了します。"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # ── アカウント ID を正規化する ──────────────────────
      #
      # 登録されている `CLOUDFLARE_ACCOUNT_ID` に空白か引用符が混ざっており、
      # `wrangler r2 bucket list` が
      #   Invalid account ID ... may only contain alphanumeric characters,
      #   hyphens, and underscores
      # で落ちた。**D1 / KV / Queues は落ちないので気づきにくい。**
      # secret を直すのが本筋だが、**混入しても落ちない形にしておく。**
      # 値そのものは出力しない（`***` でマスクされるが、長さも出さない）。
      - name: アカウント ID を正規化する
        id: account
        run: |
          raw='${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          clean=$(printf '%s' "$raw" | tr -d '[:space:]"'"'"'')
          if [ -z "$clean" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID が未登録です（token から解決を試みます）。"
          elif [ "$clean" != "$raw" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID に空白か引用符が含まれていました。除去して使います。"
            echo "**secret 自体を直すことを勧めます**（Settings → Secrets and variables → Actions）。"
          fi
          echo "::add-mask::$clean"
          echo "value=$clean" >> "$GITHUB_OUTPUT"

      - name: 資格情報の確認
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN が未登録です。"
            echo "Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          pnpm exec wrangler whoami
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}

      # ── ⓪ 現状を読むだけ（課金なし）─────────────────────
      #
      # **作る前に、作れるかを確かめる。** Queues は有料プランでしか使えず、
      # 一覧の取得可否でそれが分かる。落ちても資源は 1 つも作られない。
      - name: 現状を読む（何も作らない）
        if: inputs.phase == 'check'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          # **一覧をそのまま貼らない。** 件数が増えると末尾が切れて
          # 「無い」のか「切れた」のかが区別できなくなる（実際に一度切れた）。
          # staging に要る 18 個だけを、有無の表にして出す。
          d1=$(pnpm exec wrangler d1 list --json 2>/dev/null || echo '[]')
          kv=$(pnpm exec wrangler kv namespace list 2>/dev/null || echo '[]')
          r2=$(pnpm exec wrangler r2 bucket list 2>&1 || true)
          qs=$(pnpm exec wrangler queues list 2>&1 || true)

          {
            echo "## staging に要る資源の有無"
            echo ""
            echo "| 種別 | 名前 | 状態 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "$1 $2: $3"; }

          for n in 00 01; do
            name="proofkeeping-shard-${n}-staging"
            uuid=$(echo "$d1" | jq -r --arg n "$name" '.[] | select(.name==$n) | .uuid // empty')
            row D1 "$name" "${uuid:-**無し**}"
          done

          for b in SESSION RATELIMIT CONFIG CREDENTIALS SHARD_MAP; do
            title="${KV_TITLE_PREFIX}-${b}-${CF_ENV}"
            id=$(echo "$kv" | jq -r --arg t "$title" '.[] | select(.title==$t) | .id // empty')
            row KV "$title" "${id:-**無し**}"
          done

          for b in photos documents evidence archive; do
            if echo "$r2" | grep -q "pk-${b}-staging"; then s="あり"; else s="**無し**"; fi
            row R2 "pk-${b}-staging" "$s"
          done

          for q in pdf-generation evidence-export reconciliation rollup-update \
                   baseline-learning notification archive-restore; do
            if echo "$qs" | grep -q "pk-${q}-staging"; then s="あり"; else s="**無し**"; fi
            row Queue "pk-${q}-staging" "$s"
          done

      # ── ① 資源を作る ────────────────────────────────────
      #
      # **作成はすべて「あれば作らない」。** 途中で失敗しても、直して
      # もう一度押せばよい形にしてある（1 回しか押せない手順にしない）。
      - name: 資源を作る（D1 / KV / R2 / Queues）
        if: inputs.phase == 'resources'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail

          # D1（2 本）。既にあれば作らず、uuid を引く。
          for n in 00 01; do
            db="proofkeeping-shard-${n}-staging"
            if pnpm exec wrangler d1 list --json | jq -e --arg db "$db" '.[] | select(.name==$db)' >/dev/null; then
              echo "D1 $db: 既にあります"
            else
              echo "D1 $db: 作成します"
              pnpm exec wrangler d1 create "$db"
            fi
          done

          # KV（5 本）。`--env staging` で作ると title に環境名が入る。
          for b in SESSION RATELIMIT CONFIG CREDENTIALS SHARD_MAP; do
            title="${KV_TITLE_PREFIX}-${b}-${CF_ENV}"
            if pnpm exec wrangler kv namespace list | jq -e --arg t "$title" \
                 '.[] | select(.title==$t)' >/dev/null; then
              echo "KV $b: 既にあります"
            else
              echo "KV $b: 作成します"
              pnpm exec wrangler kv namespace create "$b" --env "$CF_ENV"
            fi
          done

          # R2（4 本）。作成済みのときはエラーになるので握りつぶす。
          for b in photos documents evidence archive; do
            pnpm exec wrangler r2 bucket create "pk-${b}-staging" || echo "R2 pk-${b}-staging: 既にあります"
          done

          # Queues（7 本）。**ここが落ちたら有料プランを確認すること。**
          for q in pdf-generation evidence-export reconciliation rollup-update \
                   baseline-learning notification archive-restore; do
            pnpm exec wrangler queues create "pk-${q}-staging" || echo "Queue pk-${q}-staging: 既にあります"
          done

      # ── ② ID を wrangler.toml へ差し替える ──────────────
      #
      # **推測した UUID を書かない**（wrangler.toml の注記）。API が返した値だけを入れる。
      - name: wrangler.toml の TODO を実 ID へ差し替える
        if: inputs.phase == 'resources'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail

          d1_json=$(pnpm exec wrangler d1 list --json)
          kv_json=$(pnpm exec wrangler kv namespace list)

          replace() {  # $1=プレースホルダ $2=実 ID
            if [ -z "$2" ] || [ "$2" = "null" ]; then
              echo "ID を引けませんでした: $1"
              exit 1
            fi
            perl -pi -e "s/\Q$1\E/$2/g" wrangler.toml
            echo "$1 → 差し替え済み"
          }

          for n in 00 01; do
            uuid=$(echo "$d1_json" | jq -r --arg db "proofkeeping-shard-${n}-staging" \
                    '.[] | select(.name==$db) | .uuid')
            replace "TODO-P0-02-未作成-STAGING-SHARD-${n}" "$uuid"
          done

          for b in SESSION RATELIMIT CONFIG CREDENTIALS SHARD_MAP; do
            id=$(echo "$kv_json" | jq -r --arg t "${KV_TITLE_PREFIX}-${b}-${CF_ENV}" \
                  '[.[] | select(.title==$t)][0].id')
            replace "TODO-P0-02-未作成-STAGING-${b}" "$id"
          done

          if grep -q "TODO-P0-02-未作成-STAGING" wrangler.toml; then
            echo "差し替え漏れがあります:"
            grep -n "TODO-P0-02-未作成-STAGING" wrangler.toml
            exit 1
          fi

      - name: ID の差し替えを PR にする
        if: inputs.phase == 'resources'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "差分はありません（既に差し替え済み）。"
            exit 0
          fi
          branch="chore/staging-resource-ids-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/web/wrangler.toml
          git commit -m "chore: staging の D1 / KV を実 ID へ差し替える"
          git push -u origin "$branch"
          # **heredoc を使わない。** YAML のブロックスカラーの中では
          # 終端記号を字下げできず、ワークフロー全体が構文エラーになる。
          {
            echo "staging-bootstrap（phase=resources）が作成した資源の ID を反映する。"
            echo ""
            echo "- D1 2 本 / KV 5 本 の ID を API の応答から差し替え"
            echo "- **推測値は入っていない。** \`wrangler d1 list\` と \`wrangler kv namespace list\` の出力のみ"
            echo ""
            echo "このPRをマージすると、main への push で staging へ自動デプロイされる。"
          } > /tmp/pr-body.md
          gh pr create --base main --head "$branch" \
            --title "chore: staging の D1 / KV を実 ID へ差し替える" \
            --body-file /tmp/pr-body.md

      # ── ⓪-3 通しの確認（ログイン → 画面 → API）─────────────
      #
      # **画面が出ることと、入れることは別。** /login が 200 でも、
      # SESSION_SECRET が無ければログインは 503 で落ちる。実際に
      # セッションを取り、認証が要る API と画面まで到達して確かめる。
      - name: 通しで確認する（ログイン・画面・API）
        if: inputs.phase == 'smoke'
        working-directory: apps/web
        run: |
          base=$(awk '/^\[env.staging.vars\]/,/^\[\[/' wrangler.toml | grep APP_BASE_URL | sed 's/.*= *//' | tr -d '"')
          jar=/tmp/pk-cookie.txt; rm -f "$jar"
          ok=0; ng=0
          say() { if [ "$1" = "0" ]; then ok=$((ok+1)); echo "OK   $2"; else ng=$((ng+1)); echo "NG   $2"; fi; }

          code=$(curl -s -o /tmp/r -w "%{http_code}" --max-time 20 "$base/api/health")
          grep -q '"state":"ok"' /tmp/r && say 0 "/api/health = ok" || say 1 "/api/health ($code): $(head -c 200 /tmp/r)"

          # **未認証は 401 であること。** 誰でも読める状態になっていないか。
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/api/v1/properties/summary")
          [ "$code" = "401" ] && say 0 "未認証の API = 401" || say 1 "未認証の API が $code"

          code=$(curl -s -o /tmp/r -w "%{http_code}" --max-time 30 -c "$jar" -X POST "$base/api/v1/auth/login" \
                 -H "content-type: application/json" \
                 -d "{\"orgShortId\":\"seed01\",\"staffNumber\":\"0001\",\"password\":\"testpass-01\"}")
          [ "$code" = "200" ] && say 0 "管理ログイン（seed01 / 0001）" || say 1 "管理ログインが $code: $(head -c 200 /tmp/r)"

          code=$(curl -s -o /tmp/r -w "%{http_code}" --max-time 20 -b "$jar" "$base/api/v1/properties/summary")
          [ "$code" = "200" ] && say 0 "施設一覧 API（$(jq -r '.data | length' /tmp/r 2>/dev/null) 件）" || say 1 "施設一覧 API が $code"

          for path in /app/dashboard /m/today; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -b "$jar" -L "$base$path")
            [ "$code" = "200" ] && say 0 "画面 $path" || say 1 "画面 $path が $code"
          done

          {
            echo "## 通し確認: 成功 $ok / 失敗 $ng"
            echo ""
            echo "- URL: $base/login"
            echo "- 組織 ID: seed01 / スタッフ番号: 0001 / パスワード: testpass-01"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ng" = "0" ]

      # ── ⓪-2 D1 の中身と、動いている Worker の様子を読む ─────
      #
      # **消す前に読む。** reset-db が「org_directory に 1 行ある」で止まった。
      # 表は 23 本ぶん揃っており、**スキーマは入っていて記録だけが無い**
      # 可能性がある。どちらなのかで打つ手が変わる。
      - name: D1 の状態を読む（何も変更しない）
        if: inputs.phase == 'db-status'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          q() {  # $1=db $2=sql
            pnpm exec wrangler d1 execute "$1" --remote --env staging --json --command="$2" \
              2>/dev/null | sed -n '/\[/,$p' | jq -c '.[].results'
          }

          for db in proofkeeping-shard-00-staging proofkeeping-shard-01-staging; do
            echo "== $db =="
            echo "表の数: $(q "$db" "SELECT count(*) AS n FROM sqlite_master WHERE type='"'"'table'"'"' AND name NOT LIKE '"'"'sqlite_%'"'"';")"
            echo "適用記録(schema_version): $(q "$db" "SELECT * FROM schema_version ORDER BY 1;")"
            echo "組織数: $(q "$db" "SELECT count(*) AS n FROM organization;")"
            echo "利用者数: $(q "$db" "SELECT count(*) AS n FROM user;")"
            echo "施設数: $(q "$db" "SELECT count(*) AS n FROM property;")"
          done

          echo "== 動いている Worker =="
          base=$(awk '/^\[env.staging.vars\]/,/^\[\[/' wrangler.toml | grep APP_BASE_URL | sed 's/.*= *//' | tr -d '"')
          echo "APP_BASE_URL=$base"
          echo "--- /api/health ---"
          curl -s --max-time 20 "$base/api/health" | head -c 600; echo
          echo "--- /login (HTTP コード) ---"
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 20 "$base/login"

      # ── ②-5 staging の D1 を空にする（復旧用）───────────────
      #
      # **中途半端に適用された状態から戻すためだけの手順。**
      # `wrangler d1 execute --file` は文を 1 つずつ送り、途中で落ちても
      # そこまでは残る。適用記録（`schema_version`）は最後にしか書かれないので、
      # **失敗した migration は「半分ある・記録は無い」状態になる。**
      # 再実行すると `table ... already exists` で必ず落ちる。
      #
      #   ✘ [ERROR] table `audit_log` already exists at offset 13: SQLITE_ERROR
      #
      # **表を落として作り直すのが唯一の戻し方。** migration に「戻す」操作は
      # 用意していない（runbook §5）。
      #
      # ── 安全のための決め事 ──────────────────────────────
      #   * `confirm` に **RESET-STAGING-DB** と打ったときだけ走る（CREATE では走らない）
      #   * 対象は `[env.staging]` の D1 だけ。名前が `-staging` で終わることを確かめる
      #   * **業務データが入っている DB では使わない。** 行数を数えて 0 でなければ止める
      - name: staging の D1 を空にする
        if: inputs.phase == 'reset-db'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail

          for db in proofkeeping-shard-00-staging proofkeeping-shard-01-staging; do
            case "$db" in
              *-staging) ;;
              *) echo "staging 以外の名前です: $db"; exit 1 ;;
            esac

            echo "== $db =="
            tables=$(pnpm exec wrangler d1 execute "$db" --remote --env staging --json \
              --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%';" \
              | sed -n '/\[/,$p' | jq -r '.[].results[].name')

            if [ -z "$tables" ]; then echo "表はありません。"; continue; fi
            echo "落とす表:"; echo "$tables"

            # **業務データが 1 行でもあれば止める。** 失敗した migration の
            # 後始末にしか使わない手順なので、中身があるのは想定外。
            for t in $tables; do
              n=$(pnpm exec wrangler d1 execute "$db" --remote --env staging --json \
                    --command="SELECT count(*) AS n FROM \`$t\`;" \
                    | sed -n '/\[/,$p' | jq -r '.[].results[].n')
              if [ "${n:-0}" != "0" ]; then
                echo "$t に $n 行あります。中止します（人が確認すること）。"
                exit 1
              fi
            done

            : > /tmp/drop.sql
            for t in $tables; do echo "DROP TABLE IF EXISTS \`$t\`;" >> /tmp/drop.sql; done
            pnpm exec wrangler d1 execute "$db" --remote --env staging --file=/tmp/drop.sql
            echo "$db: 空にしました。"
          done

      # ── ②-6 適用済みとして記録する（流さない）──────────────
      #
      # **表は揃っているのに `schema_version` が空**、という状態からの復帰。
      # staging が実際にこれだった（表 23 本ぶん・組織 1・利用者 16 に対し、
      # 適用記録は空）。この状態で migration を流すと 1 本目から
      # `table ... already exists` で落ちる。
      #
      # **中身は確かめない。「当たっている」と宣言するだけの操作**なので、
      # 合言葉を分けてある。
      - name: 適用済みとして記録する（SQL は流さない）
        if: inputs.phase == 'mark-applied'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail
          pnpm db:migrate --env staging --mark-applied
          echo "--- 記録後の状態 ---"
          pnpm db:migrate --env staging --check

      # ── ③-1 migration（シードより先）──────────────────────
      #
      # **空の D1 にシードは入らない。** 表が無いので必ず失敗する。
      # `pnpm db:migrate --env staging` は `--remote` で実在の D1 を触る。
      #
      # **ここが CI（ci.yml）と違う点。** ci.yml は main への push で
      # migration を流さない（後方互換でない変更が気づく前に当たるのを避ける /
      # runbook §3.5 ④）。**これは人が明示的に押したときだけ走る**ので流してよい。
      #
      # 触る先が staging であることは、**流す前に名前で確かめる。**
      # `--env` を間違えたときに production の 16 シャードへ当たらないようにする。
      # phase=migrate は**この 1 ステップだけ**を実行する（秘密・シードに
      # 触れない）。列追加などの後方互換 migration を、コードのデプロイ後に
      # 追いかけて当てるための最小の口（合言葉は CREATE）。
      - name: staging へ migration を流す
        if: inputs.phase == 'secrets-and-seed' || inputs.phase == 'migrate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail

          # **wrangler.toml の [env.staging] が staging の D1 だけを指すこと。**
          names=$(awk '/^\[env.staging\]/,/^\[env.production\]/' apps/web/wrangler.toml \
                  | grep 'database_name' | sed 's/.*= *//' | tr -d '"')
          echo "対象の D1:"; echo "$names"
          if echo "$names" | grep -v -- '-staging$' | grep -q .; then
            echo "staging 以外の D1 が混ざっています。中止します。"
            exit 1
          fi

          pnpm db:migrate --env staging --check || true   # 何が未適用かを先に出す
          pnpm db:migrate --env staging

      # ── ③-2 秘密の登録とシード投入（デプロイ後に実行する）──
      #
      # **値を出力しない。** 生成した SESSION_SECRET はログにも PR にも出さない。
      # シードの鍵も同様で、**このジョブの中だけで使って捨てる。**
      - name: 秘密を登録してシードを投入する
        if: inputs.phase == 'secrets-and-seed'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.value }}
        run: |
          set -euo pipefail

          session_secret=$(openssl rand -hex 32)
          seed_token=$(openssl rand -hex 32)

          # `wrangler secret put` は標準入力から読む。**引数に置かない**（ps に出る）。
          printf '%s' "$session_secret" | pnpm exec wrangler secret put SESSION_SECRET --env "$CF_ENV"
          printf '%s' "$seed_token"     | pnpm exec wrangler secret put STAGING_SEED_TOKEN --env "$CF_ENV"

          echo "登録済みの secret（名前だけ）:"
          pnpm exec wrangler secret list --env "$CF_ENV"

          # **秘密を入れた直後は再デプロイが要る**（実行中の版は古い env を持つ）。
          CLOUDFLARE_ENV="$CF_ENV" pnpm build
          name=$(jq -r .name build/server/wrangler.json)
          if [ "$name" != "$WORKER_NAME" ]; then
            echo "焼き込まれた環境が staging ではありません（name=$name）。中止します。"
            exit 1
          fi
          pnpm exec wrangler deploy

          base=$(jq -r '.vars.APP_BASE_URL' build/server/wrangler.json)
          echo "APP_BASE_URL=$base"

          # シード投入（P0-18 / DECISIONS #189）。**鍵はここでしか使わない。**
          code=$(curl -s -o /tmp/seed.json -w "%{http_code}" -X POST "$base/api/v1/dev/seed" \
            -H "content-type: application/json" \
            -H "x-pk-seed-token: $seed_token" \
            -d '{}')
          echo "seed: HTTP $code"
          jq -r '.message // .' /tmp/seed.json || cat /tmp/seed.json
          if [ "$code" != "200" ]; then
            echo "シード投入に失敗しました。APP_BASE_URL が実 URL と一致しているか確認すること。"
            exit 1
          fi

          {
            echo "## staging の初期化が完了しました"
            echo ""
            echo "- URL: $base/login"
            echo "- 組織 ID: seed01 / スタッフ番号: 0001 / パスワード: testpass-01"
            echo ""
            echo "**テストデータのみ。** 公開 URL なので、常用するなら管理画面でパスワードを変えること。"
          } >> "$GITHUB_STEP_SUMMARY"
