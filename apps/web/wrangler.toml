# 日報 PDF の生成（P2-14 / PK-SPEC-P2 §9）。@react-pdf/renderer は
# レイアウトと書体の埋め込みで数百 ms 使う。リクエストの CPU 予算
# （50ms / architecture.md §5）に収まらないのでここで処理する。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[env.preview.queues.consumers]]
