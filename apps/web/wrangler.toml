queue = "pk-archive-restore-preview"

# Queues（consumer / P2-10）。理由は top-level の [[queues.consumers]] を参照。
[[env.preview.queues.consumers]]
queue = "pk-evidence-export-preview"
max_batch_size = 1
max_batch_timeout = 5
