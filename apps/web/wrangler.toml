[env.production.assets]
directory = "build/client"

[env.production.vars]
ENVIRONMENT = "production"
SHARD_COUNT = "16"
APP_BASE_URL = "https://app.proofkeeping.example"

[[env.production.d1_databases]]
binding = "SHARD_00"
database_name = "proofkeeping-shard-00"
