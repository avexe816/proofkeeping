# ProofKeeping — Workers 設定
#
# 仕様: docs/PK-SPEC-P0.md §9.2（4 環境）, §19.2（16 シャード）
# ルール: .claude/rules/architecture.md §1, §5
#
# ------------------------------------------------------------------------------
# このファイルを読むときに知っておくこと
# ------------------------------------------------------------------------------
#
# 1. wrangler の [env.*] は top-level の binding を「継承しない」。
#    d1_databases / r2_buckets / kv_namespaces / queues / vars は
#    環境ごとに全部書き直す必要がある。重複しているのはそのため。
#
# 2. top-level（環境指定なし）は `wrangler dev` = ローカル開発用。
#    §19.2 の MUST に従い SHARD_COUNT = 1 で SHARD_00 のみを使う。
#
# 3. P0-02 は**実 ID を順次埋めている途中**。現時点で実在するのは
#    D1 の proofkeeping-shard-00 と、local の KV 5 本。
#    残りは "TODO-P0-02-未作成-*" のプレースホルダのまま。
#    作成コマンドと差し替え手順は docs/tasks/P0-02.md の作業ログにある。
#
#        grep "TODO-P0-02" apps/web/wrangler.toml
#
#    で未設定箇所を全件拾える。推測した UUID は 1 つも書いていない。
#
#    **本数をどこかに書き写さないこと。** 埋めるたびに 2 か所直すことになる。
#    tests/toolchain/wrangler.spec.ts は件数ではなく「実 ID の形か、
#    TODO-P0-02- で始まるか」だけを見ている。
#
# 4. シャード番号を URL・レスポンス・ログに出さない（architecture.md §1）。
#    binding 名は内部にとどめること。
#
# ------------------------------------------------------------------------------
# ここに「まだ」書いていないもの
# ------------------------------------------------------------------------------
#
#   [[queues.consumers]]      **P2-10 が evidence-export、P2-14 が
#                             pdf-generation を宣言した。** 残り 5 キューは
#                             ハンドラが未実装で、宣言すると wrangler が
#                             起動しない。実装する task
#                             （P3-09 / P4-14 / P6-04 / P7-09）が
#                             自分の分を 4 環境ぶん追記し、同時に
#                             src/index.ts の `queue()` へ分岐を足すこと。
#
#   InspectionLock            DO クラスが未実装。同上。P0-17 で
#   PropertyBoard             DocumentSequencer だけを宣言した。残り 3 つは
#   ReconciliationLock        実装する task（P2 / P1 / P4）が
#                             [[durable_objects.bindings]] と
#                             [[migrations]] の新しいタグを同時に足す。
#                             **既存の tag = "v1" を書き換えないこと。**
#
# ------------------------------------------------------------------------------
# Cron Triggers の本数
# ------------------------------------------------------------------------------
#
#   無料枠は 5 本まで。**現在 2 本。**
#     0 17 * * *      P1-03 タスク自動生成（02:00 JST）
#     */10 * * * *    P2-14 日報（日締め + 10 分の施設を拾う）
#   足す task は、この行の本数を数え直してから追記すること。
#   cron 式は UTC 指定。日本時間で書かない（下の [triggers] の注記を参照）。
#   **10 分ごとの回は施設ごとの日締め時刻と突き合わせて絞る**
#   （apps/web/src/lib/report/schedule.ts）。日締めは施設が設定できるので、
#   「05:10 に走る cron」では設定を変えた施設の日報が出ない。
#
# ------------------------------------------------------------------------------

name = "pk-local"
main = "src/index.ts"
compatibility_date = "2026-08-11"

# @react-pdf/renderer（日報 PDF / P2-14）が Node の API を使う。
# **継承されるキーなので [env.*] へ書き写さない**（compatibility_date と同じ扱い。
# binding だけが継承されない）。フラグの後付けは非破壊。
compatibility_flags = ["nodejs_compat"]

account_id = "6c8b5b6228c4021c651755d1c5fb53d6"

# workers.dev のサブドメインに露出させない。独自ドメインのみで公開する。
workers_dev = false

# --- 静的アセット（P0-14）-----------------------------------------------------
# React Router のクライアントビルド（JS / CSS）。**Worker より前に返る。**
# ここに来た時点で `src/index.ts` は動かないので、アセットの配信に
# 認証は掛からない。**アセットに秘密を含めないこと。**
#
# ディレクトリは vite（React Router）の既定の出力先。`pnpm --filter @pk/web build`
# を実行するまで存在しない。
[assets]
directory = "build/client"

# ==============================================================================
# local — `wrangler dev`（miniflare）
# ==============================================================================
#
# ローカルは remote D1 へ接続せず、.wrangler/state 配下の SQLite を使う。
# SHARD_00 に実 database_id を書いてあるのは `--remote` 実行時の整合のためで、
# 通常の `pnpm dev` が本番データに触れることはない。

[vars]
ENVIRONMENT = "local"
SHARD_COUNT = "1"
APP_BASE_URL = "http://localhost:8787"

# --- D1 ---------------------------------------------------------------------
[[d1_databases]]
binding = "SHARD_00"
database_name = "proofkeeping-shard-00"
database_id = "547d200a-6f86-41a9-b262-484329d44c59"

# --- R2 ---------------------------------------------------------------------
# キー体系は .claude/rules/security.md §4 を参照。
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pk-photos-local"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "pk-documents-local"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "pk-evidence-local"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "pk-archive-local"

# --- KV ---------------------------------------------------------------------
# id は miniflare がローカル永続化ディレクトリ名に使う。
# binding ごとに違う値にしないと 5 つの namespace が 1 つのストアに混ざる。
[[kv_namespaces]]
binding = "SESSION"
id = "06a09cc856fa4701bf34335f411eec8a"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "3d7eb0eb7d6b490c82416c2938b0af4f"

[[kv_namespaces]]
binding = "CONFIG"
id = "efbfa39534634153870f4b264599d90a"

# シャードの明示マッピング（shard:{organizationId}）専用。architecture.md §1 の MUST:
# TTL を設定してはならない。失効すると resolveShard() が無警告で fnv1a32 の
# フォールバックに落ち、同一テナントのデータが複数シャードに分裂する。
# 一括更新・一括削除の対象になる CONFIG と同居させない（DECISIONS.md #004）。
[[kv_namespaces]]
binding = "SHARD_MAP"
id = "e742a31b29bb4d459e0265b506684f07"

# 外部連携の資格情報は暗号化してここに置き、DB からは credentialRef で参照する
# （security.md §7）。
[[kv_namespaces]]
binding = "CREDENTIALS"
id = "b3fa902ae37448c5ae738a18f88d0ee2"

# --- Queues（producer のみ）---------------------------------------------------
# 用途は architecture.md §5 / PK-SPEC-P0 §19.10。
[[queues.producers]]
binding = "QUEUE_PDF_GENERATION"
queue = "pk-pdf-generation-local"

[[queues.producers]]
binding = "QUEUE_EVIDENCE_EXPORT"
queue = "pk-evidence-export-local"

[[queues.producers]]
binding = "QUEUE_RECONCILIATION"
queue = "pk-reconciliation-local"

[[queues.producers]]
binding = "QUEUE_ROLLUP_UPDATE"
queue = "pk-rollup-update-local"

[[queues.producers]]
binding = "QUEUE_BASELINE_LEARNING"
queue = "pk-baseline-learning-local"

[[queues.producers]]
binding = "QUEUE_NOTIFICATION"
queue = "pk-notification-local"

[[queues.producers]]
binding = "QUEUE_ARCHIVE_RESTORE"
queue = "pk-archive-restore-local"

# --- Queues（consumer）------------------------------------------------------
# ハンドラは apps/web/src/index.ts の `queue()`。**宣言したキューには
# 必ず分岐があること**（無いと再送し続ける）。
#
# 証跡 ZIP の生成（P2-10 / PK-SPEC-P2 §6.5）。写真 20 枚の読み取りと
# ハッシュはリクエストハンドラの CPU 予算に収まらない（architecture.md §5）。
#
# max_batch_size を 1 にしてあるのは、1 件で数 MB を扱うため。
# まとめて処理するとコンシューマ 1 回のメモリが積み上がる。
[[queues.consumers]]
queue = "pk-evidence-export-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 日報 PDF の生成（P2-14 / PK-SPEC-P2 §9）。@react-pdf/renderer は
# レイアウトと書体の埋め込みで数百 ms 使う。リクエストの CPU 予算
# （50ms / architecture.md §5）に収まらないのでここで処理する。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[queues.consumers]]
queue = "pk-pdf-generation-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# --- Durable Objects（P0-17）------------------------------------------------
# architecture.md §4 の 4 用途に限る。**クラスを実装した task だけが
# ここへ binding を足す。** 実装のない binding を宣言すると wrangler が
# 起動しない。クラスは apps/web/src/index.ts が export する。
[[durable_objects.bindings]]
name = "DOCUMENT_SEQUENCER"
class_name = "DocumentSequencer"

# 検査開始の排他制御（P2-03 / PK-SPEC-P2 §4.2）。粒度はタスク。
[[durable_objects.bindings]]
name = "INSPECTION_LOCK"
class_name = "InspectionLock"

# DO クラスの追加は migrations タグで宣言する。**既存のタグを書き換えない。**
# クラスを増やすときは新しいタグ（v2, v3 …）を追記する。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSequencer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InspectionLock"]

# --- Cron Triggers（P1-03）---------------------------------------------------
# PK-SPEC-P1 §3.2: 02:00 に全アクティブ施設の翌業務日のタスクを生成する。
# **cron 式は UTC。** 02:00 Asia/Tokyo = 17:00 UTC（前日）。
# 日本は夏時間を採らないので固定のオフセットで足りる。
#
# ハンドラは apps/web/src/index.ts の `scheduled()`。
# **本数を増やすときは無料枠（5 本）を数えること。** 現在 1 本。
[triggers]
crons = ["0 17 * * *", "*/10 * * * *"]

