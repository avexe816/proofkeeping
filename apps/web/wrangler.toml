# ==============================================================================
# staging — main マージで自動デプロイ（§9.2: pk-staging / 2 シャード）
# ==============================================================================
#
# シャードが 2 本あるのは意味がある。SHARD_COUNT = 1 では
# fnv1a32(orgId) % 1 が常に 0 になり、ルーティングの分岐が一度も踏まれない。
# staging で 2 本持つことで「複数シャードに散る」経路を実際に通す。

[env.staging]
name = "pk-staging"

# **staging だけは workers.dev に出す。**
#
# top-level の `workers_dev = false` は**継承されるキー**で、binding と違って
# [env.*] へ書かなくても効いてしまう。staging には独自ドメインの route を
# 宣言していないため、**false のままだと URL を 1 つも持たない Worker が
# 出来上がる。** デプロイは成功し、叩ける先が無い状態になる。
#
# staging は「画面を継続的に確認するための固定 URL」が存在理由なので、
# ここだけ true にして `https://pk-staging.<アカウントのサブドメイン>.workers.dev`
# を得る。**URL はデプロイのたびに変わらない**（Worker 名が固定のため）。
#
# production を false のままにしてあるのは意図的（独自ドメインのみで公開する）。
# **この行を production へ書き写さないこと。**
workers_dev = true

# 静的アセット（P0-14）。[env.*] は top-level を継承しないため環境ごとに書く。
[env.staging.assets]
directory = "build/client"

[env.staging.vars]
ENVIRONMENT = "staging"
SHARD_COUNT = "2"
# 初回デプロイの出力と一致すること（runbook §3.5 ⑤）。
# `pk-staging` は固定名なので URL も固定。**サブドメインはアカウント固有。**
APP_BASE_URL = "https://pk-staging.ukh816-account.workers.dev"
# 運営面（/plat/*）の第 2 要素（PF-19 / DECISIONS #250）。
# **要求する。** 2026-08-22 に "false" から戻した — 無効化は「TOTP の登録が
# 通らない」を解くための一時的な措置で、原因が**端末の時刻ずれ系**と判明し、
# 登録も成功したため役目を終えた（監査ログで切り分け / #250 の追記）。
# **スイッチ自体は残してある**（lib/platform/twoFactorPolicy.ts）。
# **production では false にできない** — あちらは値を読まずに常に要求する。
# 切り替えの手順は runbook §10。
PLATFORM_2FA_REQUIRED = "true"
RESEND_FROM_ADDRESS = "billing@example.invalid"
# メール送信（Lark Mail SMTP / P5-21・DECISIONS #248）。
# **秘密は SMTP_PASSWORD だけ**で、それは `wrangler secret put` で入れる。
# 465 = implicit TLS が第一候補。使えないと分かったときだけ
# SMTP_SECURE="starttls" + SMTP_PORT="587" へ倒す（**25 番は使わない**）。
SMTP_HOST = "smtp.larksuite.com"
SMTP_PORT = "465"
SMTP_SECURE = "implicit"
SMTP_USERNAME = "noreply@stek.ai"
MAIL_FROM = "ProofKeeping <noreply@stek.ai>"

[[env.staging.d1_databases]]
