# ProofKeeping — Workers 設定
#
# 仕様: docs/PK-SPEC-P0.md §9.2（4 環境）, §19.2（16 シャード）
# ルール: .claude/rules/architecture.md §1, §5
#
# ------------------------------------------------------------------------------
# このファイルを読むときに知っておくこと
# ------------------------------------------------------------------------------
#
# 1. wrangler の [env.*] は top-level の binding を「継承しない」。
#    d1_databases / r2_buckets / kv_namespaces / queues / vars は
#    環境ごとに全部書き直す必要がある。重複しているのはそのため。
#
# 2. top-level（環境指定なし）は `wrangler dev` = ローカル開発用。
#    §19.2 の MUST に従い SHARD_COUNT = 1 で SHARD_00 のみを使う。
#
# 3. P0-02 は**実 ID を順次埋めている途中**。現時点で実在するのは
#    D1 の proofkeeping-shard-00 と、local の KV 5 本。
#    残りは "TODO-P0-02-未作成-*" のプレースホルダのまま。
#    作成コマンドと差し替え手順は docs/tasks/P0-02.md の作業ログにある。
#
#        grep "TODO-P0-02" apps/web/wrangler.toml
#
#    で未設定箇所を全件拾える。推測した UUID は 1 つも書いていない。
#
#    **本数をどこかに書き写さないこと。** 埋めるたびに 2 か所直すことになる。
#    tests/toolchain/wrangler.spec.ts は件数ではなく「実 ID の形か、
#    TODO-P0-02- で始まるか」だけを見ている。
#
# 4. シャード番号を URL・レスポンス・ログに出さない（architecture.md §1）。
#    binding 名は内部にとどめること。
#
# ------------------------------------------------------------------------------
# ここに「まだ」書いていないもの
# ------------------------------------------------------------------------------
#
#   [[queues.consumers]]      **P2-10 が evidence-export、P2-14 が
#                             pdf-generation、P3-09 が baseline-learning、
#                             P4-05 が reconciliation、P5-07 が notification、
#                             P5-14 が rollup-update を宣言した。**
#                             残り 2 キューはハンドラが未実装で、宣言すると
#                             wrangler が起動しない。実装する task
#                             （P6-04 / P6-09 / P7-09）が
#                             自分の分を 4 環境ぶん追記し、同時に
#                             src/index.ts の `queue()` へ分岐を足すこと。
#
#   PropertyBoard             DO クラスが未実装。同上。P0-17 で
#                             DocumentSequencer だけを宣言した。残る 1 つは
#                             実装する task（P1）が
#                             [[durable_objects.bindings]] と
#                             [[migrations]] の新しいタグを同時に足す。
#                             **既存の tag = "v1" を書き換えないこと。**
#
# ------------------------------------------------------------------------------
# Cron Triggers の本数
# ------------------------------------------------------------------------------
#
#   無料枠は 5 本まで。**現在 2 本。**
#     0 17 * * *      P1-03 タスク自動生成（02:00 JST）
#     */10 * * * *    P2-14 日報（日締め + 10 分の施設を拾う）
#   **稼働照合（P4-05 / §5.1）は 02:00 JST の回に相乗りしている。**
#   同じ時刻の cron を 2 本置いても振り分けられないため、`0 17 * * *` の
#   分岐でタスク生成と照合の両方を走らせる（DECISIONS #113）。
#   足す task は、この行の本数を数え直してから追記すること。
#   cron 式は UTC 指定。日本時間で書かない（下の [triggers] の注記を参照）。
#   **10 分ごとの回は施設ごとの日締め時刻と突き合わせて絞る**
#   （apps/web/src/lib/report/schedule.ts）。日締めは施設が設定できるので、
#   「05:10 に走る cron」では設定を変えた施設の日報が出ない。
#
# ------------------------------------------------------------------------------

name = "pk-local"
main = "src/index.ts"
compatibility_date = "2026-08-11"

# @react-pdf/renderer（日報 PDF / P2-14）が Node の API を使う。
# **継承されるキーなので [env.*] へ書き写さない**（compatibility_date と同じ扱い。
# binding だけが継承されない）。フラグの後付けは非破壊。
compatibility_flags = ["nodejs_compat"]

account_id = "6c8b5b6228c4021c651755d1c5fb53d6"

# workers.dev のサブドメインに露出させない。独自ドメインのみで公開する。
workers_dev = false

# --- 静的アセット（P0-14）-----------------------------------------------------
# React Router のクライアントビルド（JS / CSS）。**Worker より前に返る。**
# ここに来た時点で `src/index.ts` は動かないので、アセットの配信に
# 認証は掛からない。**アセットに秘密を含めないこと。**
#
# ディレクトリは vite（React Router）の既定の出力先。`pnpm --filter @pk/web build`
# を実行するまで存在しない。
[assets]
directory = "build/client"

# ==============================================================================
# local — `wrangler dev`（miniflare）
# ==============================================================================
#
# ローカルは remote D1 へ接続せず、.wrangler/state 配下の SQLite を使う。
# SHARD_00 に実 database_id を書いてあるのは `--remote` 実行時の整合のためで、
# 通常の `pnpm dev` が本番データに触れることはない。

[vars]
ENVIRONMENT = "local"
SHARD_COUNT = "1"
APP_BASE_URL = "http://localhost:8787"
# 運営面（/plat/*）の第 2 要素（PF-19 / DECISIONS #250）。
# **既定は要求する。** false にしてよいのは staging だけ。
PLATFORM_2FA_REQUIRED = "true"
RESEND_FROM_ADDRESS = "billing@example.invalid"
# メール送信（Lark Mail SMTP / P5-21・DECISIONS #248）。
# **秘密は SMTP_PASSWORD だけ**で、それは `wrangler secret put` で入れる。
# 465 = implicit TLS が第一候補。使えないと分かったときだけ
# SMTP_SECURE="starttls" + SMTP_PORT="587" へ倒す（**25 番は使わない**）。
SMTP_HOST = "smtp.larksuite.com"
SMTP_PORT = "465"
SMTP_SECURE = "implicit"
SMTP_USERNAME = "noreply@stek.ai"
MAIL_FROM = "ProofKeeping <noreply@stek.ai>"

# --- D1 ---------------------------------------------------------------------
[[d1_databases]]
binding = "SHARD_00"
database_name = "proofkeeping-shard-00"
database_id = "547d200a-6f86-41a9-b262-484329d44c59"

# --- R2 ---------------------------------------------------------------------
# キー体系は .claude/rules/security.md §4 を参照。
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pk-photos-local"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "pk-documents-local"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "pk-evidence-local"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "pk-archive-local"

# --- KV ---------------------------------------------------------------------
# id は miniflare がローカル永続化ディレクトリ名に使う。
# binding ごとに違う値にしないと 5 つの namespace が 1 つのストアに混ざる。
[[kv_namespaces]]
binding = "SESSION"
id = "06a09cc856fa4701bf34335f411eec8a"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "3d7eb0eb7d6b490c82416c2938b0af4f"

[[kv_namespaces]]
binding = "CONFIG"
id = "efbfa39534634153870f4b264599d90a"

# シャードの明示マッピング（shard:{organizationId}）専用。architecture.md §1 の MUST:
# TTL を設定してはならない。失効すると resolveShard() が無警告で fnv1a32 の
# フォールバックに落ち、同一テナントのデータが複数シャードに分裂する。
# 一括更新・一括削除の対象になる CONFIG と同居させない（DECISIONS.md #004）。
[[kv_namespaces]]
binding = "SHARD_MAP"
id = "e742a31b29bb4d459e0265b506684f07"

# 外部連携の資格情報は暗号化してここに置き、DB からは credentialRef で参照する
# （security.md §7）。
[[kv_namespaces]]
binding = "CREDENTIALS"
id = "b3fa902ae37448c5ae738a18f88d0ee2"

# --- Queues（producer のみ）---------------------------------------------------
# 用途は architecture.md §5 / PK-SPEC-P0 §19.10。
[[queues.producers]]
binding = "QUEUE_PDF_GENERATION"
queue = "pk-pdf-generation-local"

[[queues.producers]]
binding = "QUEUE_EVIDENCE_EXPORT"
queue = "pk-evidence-export-local"

[[queues.producers]]
binding = "QUEUE_RECONCILIATION"
queue = "pk-reconciliation-local"

[[queues.producers]]
binding = "QUEUE_ROLLUP_UPDATE"
queue = "pk-rollup-update-local"

[[queues.producers]]
binding = "QUEUE_BASELINE_LEARNING"
queue = "pk-baseline-learning-local"

[[queues.producers]]
binding = "QUEUE_NOTIFICATION"
queue = "pk-notification-local"

[[queues.producers]]
binding = "QUEUE_ARCHIVE_RESTORE"
queue = "pk-archive-restore-local"

# --- Queues（consumer）------------------------------------------------------
# ハンドラは apps/web/src/index.ts の `queue()`。**宣言したキューには
# 必ず分岐があること**（無いと再送し続ける）。
#
# 証跡 ZIP の生成（P2-10 / PK-SPEC-P2 §6.5）。写真 20 枚の読み取りと
# ハッシュはリクエストハンドラの CPU 予算に収まらない（architecture.md §5）。
#
# max_batch_size を 1 にしてあるのは、1 件で数 MB を扱うため。
# まとめて処理するとコンシューマ 1 回のメモリが積み上がる。
[[queues.consumers]]
queue = "pk-evidence-export-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 日報 PDF の生成（P2-14 / PK-SPEC-P2 §9）。@react-pdf/renderer は
# レイアウトと書体の埋め込みで数百 ms 使う。リクエストの CPU 予算
# （50ms / architecture.md §5）に収まらないのでここで処理する。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[queues.consumers]]
queue = "pk-pdf-generation-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 消耗ベースラインの再計算（P3-09 / PK-SPEC-P3 §5）。90 日ぶんの観察を読み、
# 品目ごとに整列して百分位を取る。リクエストの CPU 予算（50ms /
# architecture.md §5）に収まらないのでここで処理する。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[queues.consumers]]
queue = "pk-baseline-learning-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 稼働照合バッチ（P4-05 / PK-SPEC-P4 §5）。1 施設 × 1 業務日ぶんの 3 系統を
# 読んで突き合わせる。リクエストの CPU 予算（50ms / architecture.md §5）に
# 収まらないのでここで処理する。**二重起動は ReconciliationLock が断る**（§5.2）。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[queues.consumers]]
queue = "pk-reconciliation-local"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 帳票の送付（P5-07 / PK-SPEC-P5 §4.1 の ⑩〜⑫）。Resend への送信と
# 送付ログの記録。**リクエストハンドラから送らない**（外部 API の
# 応答待ちが CPU 予算とは別に待ち時間として乗る）。
#
# max_batch_size = 5。1 件が軽い（HTTP 1 往復）ので束ねてよいが、
# **失敗した 1 件だけを retry したい**ので大きくしない。
[[queues.consumers]]
queue = "pk-notification-local"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3

# 日次集計の更新（P5-14 / PK-SPEC-P0 §19.6）。タスク完了・検査完了・照合完了の
# たびに 1 施設 × 1 業務日を数え直して UPSERT する。**再計算方式**なので
# 同じメッセージが重なっても結果が変わらない（§19.6 MUST）。
#
# max_batch_size = 10。1 件が軽く（数え直す 3 本 + UPSERT）、同じ施設・
# 同じ業務日のメッセージが束になって届くことが多い。**束ねても結果は同じ。**
[[queues.consumers]]
queue = "pk-rollup-update-local"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# 年次アーカイブ（P7-08 / PK-SPEC-P0 §19.7）。1 組織 × 1 年ぶんを
# JSONL → gzip → R2 へ退避する。**「削除」ではない**（D1 の行は残る /
# docs/DECISIONS.md #159）。
#
# max_batch_size = 1。1 件が重い（表 5 本ぶんの全行読み取りと R2 への PUT）。
# 束ねると 1 件の失敗で全部が再送になる。
# max_retries = 3。年次の実行なので急いで直す理由が無く、
# 再送しても直らないもの（組織が無い等）は消費側が ack して落とす。
[[queues.consumers]]
queue = "pk-archive-restore-local"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3

# --- Durable Objects（P0-17）------------------------------------------------
# architecture.md §4 の 4 用途に限る。**クラスを実装した task だけが
# ここへ binding を足す。** 実装のない binding を宣言すると wrangler が
# 起動しない。クラスは apps/web/src/index.ts が export する。
[[durable_objects.bindings]]
name = "DOCUMENT_SEQUENCER"
class_name = "DocumentSequencer"

# 検査開始の排他制御（P2-03 / PK-SPEC-P2 §4.2）。粒度はタスク。
[[durable_objects.bindings]]
name = "INSPECTION_LOCK"
class_name = "InspectionLock"

# 照合バッチの二重起動防止（P4-05 / PK-SPEC-P4 §5.2）。粒度は施設 × 業務日。
[[durable_objects.bindings]]
name = "RECONCILIATION_LOCK"
class_name = "ReconciliationLock"

# DO クラスの追加は migrations タグで宣言する。**既存のタグを書き換えない。**
# クラスを増やすときは新しいタグ（v2, v3 …）を追記する。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSequencer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InspectionLock"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReconciliationLock"]

# --- Cron Triggers（P1-03）---------------------------------------------------
# PK-SPEC-P1 §3.2: 02:00 に全アクティブ施設の翌業務日のタスクを生成する。
# **cron 式は UTC。** 02:00 Asia/Tokyo = 17:00 UTC（前日）。
# 日本は夏時間を採らないので固定のオフセットで足りる。
#
# ハンドラは apps/web/src/index.ts の `scheduled()`。
# PK-SPEC-P3 §5.1: 毎週日曜 03:00 にベースラインを再計算する（P3-09）。
# 03:00 Asia/Tokyo = 前日（土曜）18:00 UTC なので `0 18 * * 6`。
# **曜日も 1 つ戻ること。** `0 18 * * 0` にすると日曜の 18:00 UTC、
# つまり月曜 03:00 JST に走る。
#
# PK-SPEC-P5 §6.1: 毎月 1 日 04:00 に月次締めを起票する（P5-05）。
# 04:00 Asia/Tokyo = 前日 19:00 UTC で、その「前日」は月末日。
# cron に「月末」を表す書き方が無いので 28〜31 日を並べ、**JST の
# 1 日かどうかはハンドラ（`isMonthlyCloseMoment()`）が確かめる。**
# 月末が 30 日の月は 31 日の回が発火せず、31 日ある月は 30 日の回も
# 発火する。式だけでは撃ち分けられないので判定をコード側に置いてある。
#
# **本数を増やすときは無料枠（5 本）を数えること。** 現在 4 本。
[triggers]
crons = ["0 17 * * *", "*/10 * * * *", "0 18 * * 6", "0 19 28-31 * *", "0 22 * * *"]

# ==============================================================================
# preview — PR ごと（§9.2: pk-pr-{n} / 1 シャード）
# ==============================================================================
#
# Worker 名は PR 番号を含められないため固定名を置く。
# PR ごとに分ける場合は CI で `--name pk-pr-${PR_NUMBER}` を渡す（P0-19）。

[env.preview]
name = "pk-preview"

# 静的アセット（P0-14）。[env.*] は top-level を継承しないため環境ごとに書く。
[env.preview.assets]
directory = "build/client"

[env.preview.vars]
ENVIRONMENT = "preview"
SHARD_COUNT = "1"
APP_BASE_URL = "https://pk-preview.example.workers.dev"
# 運営面（/plat/*）の第 2 要素（PF-19 / DECISIONS #250）。
# **既定は要求する。** false にしてよいのは staging だけ。
PLATFORM_2FA_REQUIRED = "true"
RESEND_FROM_ADDRESS = "billing@example.invalid"
# メール送信（Lark Mail SMTP / P5-21・DECISIONS #248）。
# **秘密は SMTP_PASSWORD だけ**で、それは `wrangler secret put` で入れる。
# 465 = implicit TLS が第一候補。使えないと分かったときだけ
# SMTP_SECURE="starttls" + SMTP_PORT="587" へ倒す（**25 番は使わない**）。
SMTP_HOST = "smtp.larksuite.com"
SMTP_PORT = "465"
SMTP_SECURE = "implicit"
SMTP_USERNAME = "noreply@stek.ai"
MAIL_FROM = "ProofKeeping <noreply@stek.ai>"

[[env.preview.d1_databases]]
binding = "SHARD_00"
database_name = "proofkeeping-shard-00-preview"
database_id = "TODO-P0-02-未作成-PREVIEW-SHARD-00"

[[env.preview.r2_buckets]]
binding = "PHOTOS"
bucket_name = "pk-photos-preview"

[[env.preview.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "pk-documents-preview"

[[env.preview.r2_buckets]]
binding = "EVIDENCE"
bucket_name = "pk-evidence-preview"

[[env.preview.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "pk-archive-preview"

[[env.preview.kv_namespaces]]
binding = "SESSION"
id = "TODO-P0-02-未作成-PREVIEW-SESSION"

[[env.preview.kv_namespaces]]
binding = "RATELIMIT"
id = "TODO-P0-02-未作成-PREVIEW-RATELIMIT"

[[env.preview.kv_namespaces]]
binding = "CONFIG"
id = "TODO-P0-02-未作成-PREVIEW-CONFIG"

[[env.preview.kv_namespaces]]
binding = "CREDENTIALS"
id = "TODO-P0-02-未作成-PREVIEW-CREDENTIALS"

# TTL 禁止。理由は top-level の SHARD_MAP のコメントを参照。
[[env.preview.kv_namespaces]]
binding = "SHARD_MAP"
id = "TODO-P0-02-未作成-PREVIEW-SHARD_MAP"

[[env.preview.queues.producers]]
binding = "QUEUE_PDF_GENERATION"
queue = "pk-pdf-generation-preview"

[[env.preview.queues.producers]]
binding = "QUEUE_EVIDENCE_EXPORT"
queue = "pk-evidence-export-preview"

[[env.preview.queues.producers]]
binding = "QUEUE_RECONCILIATION"
queue = "pk-reconciliation-preview"

[[env.preview.queues.producers]]
binding = "QUEUE_ROLLUP_UPDATE"
queue = "pk-rollup-update-preview"

[[env.preview.queues.producers]]
binding = "QUEUE_BASELINE_LEARNING"
queue = "pk-baseline-learning-preview"

[[env.preview.queues.producers]]
