# 消耗ベースラインの再計算（P3-09 / PK-SPEC-P3 §5）。90 日ぶんの観察を読み、
# 品目ごとに整列して百分位を取る。リクエストの CPU 予算（50ms /
# architecture.md §5）に収まらないのでここで処理する。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[env.preview.queues.consumers]]
queue = "pk-baseline-learning-preview"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 稼働照合バッチ（P4-05 / PK-SPEC-P4 §5）。1 施設 × 1 業務日ぶんの 3 系統を
# 読んで突き合わせる。リクエストの CPU 予算（50ms / architecture.md §5）に
# 収まらないのでここで処理する。**二重起動は ReconciliationLock が断る**（§5.2）。
#
# max_batch_size = 1 は evidence-export と同じ理由（1 件が重い）。
[[env.preview.queues.consumers]]
queue = "pk-reconciliation-preview"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# 帳票の送付（P5-07 / PK-SPEC-P5 §4.1 の ⑩〜⑫）。理由は top-level を参照。
[[env.preview.queues.consumers]]
queue = "pk-notification-preview"
max_batch_size = 5
