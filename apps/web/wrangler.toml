name = "INSPECTION_LOCK"
class_name = "InspectionLock"

# 照合バッチの二重起動防止（P4-05 / PK-SPEC-P4 §5.2）。粒度は施設 × 業務日。
[[env.production.durable_objects.bindings]]
name = "RECONCILIATION_LOCK"
class_name = "ReconciliationLock"

# DO クラスの追加は migrations タグで宣言する。**既存のタグを書き換えない。**
# クラスを増やすときは新しいタグ（v2, v3 …）を追記する。
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSequencer"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["InspectionLock"]

[[env.production.migrations]]
tag = "v3"
new_sqlite_classes = ["ReconciliationLock"]

# Cron Triggers（P1-03）。理由と cron 式の根拠は top-level の [triggers] を参照。
# [env.*] は top-level を継承しないため環境ごとに書く。
[env.production.triggers]
crons = ["0 17 * * *", "*/10 * * * *", "0 18 * * 6", "0 19 28-31 * *", "0 22 * * *"]
